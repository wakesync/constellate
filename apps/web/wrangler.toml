name = "constellate-demo-app"
# account_id = "<your-cloudflare-account-id>"
main = "worker/index.ts"
compatibility_date = "2024-11-12"
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# The app is served at the APEX: constellate.example (memorable, the link you share).
# www.constellate.example redirects to apex via a Cloudflare Bulk Redirect / Rule
# . Passkey RP_ID = constellate.example covers apex + subdomains.
[[routes]]
pattern = "constellate.example"
custom_domain = true

# Set VITE_API_URL to your own API origin before building. Never point a demo at production.
